<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post an opportunity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1E;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEEEA; color: #1F1F1E; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

<header style="padding: 56px 20px 0; display: flex; align-items: center; justify-content: space-between">
<a href="M1-Work.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<p style="margin: 0; font-size: 12px; color: #6E6C67">Step 1 of 2</p>
</header>

<form style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.04em; line-height: 1">Post an<br>opportunity</h1>
<div role="tablist" aria-label="Details from" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #1F1F1E">
<a href="M1-PostLinked.dc.html" role="tab" aria-selected="false" style="height: 40px; font-size: 13px; display: flex; align-items: center; justify-content: center">Link to an event</a>
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; background: #1F1F1E; color: #EFEEEA; font: inherit; font-size: 13px; font-weight: 600">Write it yourself</button>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">■ Posting as</legend>
<div style="display: flex; gap: 6px">
<label style="flex: 1; height: 44px; padding: 0 12px; border: 1px solid #D6D3CC; display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="radio" name="as" style="accent-color: #1F1F1E; margin: 0">Myself</label>
<label style="flex: 1.4; height: 44px; padding: 0 12px; border: 1px solid #1F1F1E; background: #F7F6F3; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500"><input type="radio" name="as" checked style="accent-color: #1F1F1E; margin: 0">Quartetto Felsina</label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="who" style="font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">■ Who do you need</label>
<input id="who" value="Accordion" style="height: 44px; border: 0; border-bottom: 1px solid #1F1F1E; background: transparent; padding: 0; font: inherit; font-size: 18px; font-weight: 500; color: #1F1F1E">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="when" style="font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">■ When</label><input id="when" value="14.03, 20:30" style="height: 44px; border: 0; border-bottom: 1px solid #D6D3CC; background: transparent; padding: 0; font: inherit; font-size: 16px; color: #1F1F1E"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="where" style="font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">■ Where</label><input id="where" value="Bologna" style="height: 44px; border: 0; border-bottom: 1px solid #D6D3CC; background: transparent; padding: 0; font: inherit; font-size: 16px; color: #1F1F1E"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fee" style="font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">■ Fee · required, always shown</label>
<div style="display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid #1F1F1E"><span style="font-size: 28px; font-weight: 500; letter-spacing: -0.03em">€</span><input id="fee" value="240" style="flex: 1; min-width: 0; height: 52px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 28px; font-weight: 500; letter-spacing: -0.03em; color: #1F1F1E"><span style="font-size: 12px; color: #6E6C67">total, 3 services</span></div>
</div>

<label style="display: flex; gap: 14px; align-items: flex-start; padding: 14px; background: #F7F6F3; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: {{accent}}; flex: none">
<span style="line-height: 1.35"><span style="display: block; font-weight: 600">Last-minute</span><span style="font-size: 13px; color: #6E6C67">Notify musicians who are free that day and within 50 km, right now.</span></span>
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; display: flex; justify-content: space-between">■ Repertoire<span style="letter-spacing: 0; text-transform: none; color: #6E6C67">helps us find the right players</span></p>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #F7F6F3"><span><span style="font-weight: 600">Piazzolla</span> · <span style="font-family: Newsreader, serif; font-style: italic; font-size: 16px">Histoire du Tango</span></span><button type="button" aria-label="Remove work" style="width: 28px; height: 28px; border: 0; background: none; color: #6E6C67">×</button></div>
<button type="button" style="height: 40px; border: 1px dashed #1F1F1E; background: none; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a work</button>
</div>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 34px; background: #EFEEEA; border-top: 1px solid #D6D3CC; display: flex; gap: 10px">
<a href="#" style="flex: 1; height: 52px; padding: 0 16px; background: {{accent}}; color: {{onAccent}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between">Review and post<svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor" aria-hidden="true"><path d="M2 0l4 4-4 4z"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F1F1E","options":["#1F1F1E","#E2641B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F1F1E';
    const mono = accent.toUpperCase() === '#1F1F1E';
    return { accent, onAccent: mono ? '#EFEEEA' : '#1F1F1E', accentText: mono ? '#1F1F1E' : '#B84A0E' };
  }
}
</script>
</body>
</html>
